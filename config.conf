# Bootloop Guard 配置文件
#
# MAX_FAILS：连续多少次开机失败（未完成开机）后触发救砖
#   默认 3，可根据需要改成 2~10 之间的整数
#
# WATCHDOG_ENABLE：卡开机动画看门狗开关（true=开启 / false=关闭）
# WATCHDOG_TIMEOUT：看门狗超时时间（秒），默认 120（2 分钟）
#   若超过该时间开机动画（第二屏）仍未结束，判定为卡死并触发救砖
#   最低 60 秒；低端机/刚刷完大包建议调大到 900~1800
#
# FREEZE_MODULES：触发救砖时是否先冻结模块（true=开启 / false=关闭）
#   冻结 = 在该模块目录创建 disable 标志，下次开机 Magisk 不再挂载它
#   解冻 = 删除 /data/adb/modules/<模块id>/disable 文件即可恢复
#   （冻结完成后才会重启进入 Recovery）
#
# FREEZE_MODE：冻结范围，默认 auto
#   auto = 精准模式：只冻结“上次正常开机后新增/启用”的嫌疑模块；
#          识别不出嫌疑人时（无历史清单或无新增模块）回退为全量冻结
#   all  = 全量模式：直接冻结全部模块
#   任何模式下本模块自身与 whitelist.conf 白名单内的模块都不会被冻结
#
# UNFREEZE_APPS：触发救砖时是否同时解冻 APP（true=开启 / false=关闭，默认 true）
#   原理：把 /data/system/users/*/package-restrictions.xml 改名备份为
#   .bak-bootloopguard，系统下次启动自动重建该文件，所有被系统后台
#   冻结/限制的应用随之解冻。该文件损坏或误冻结关键应用会导致无法开机。
#   如需恢复原名单，把 .bak-bootloopguard 改回原名即可
#
# 修改后无需重装模块，下次开机自动生效
# ============================================================================
MAX_FAILS=3
WATCHDOG_ENABLE=true
WATCHDOG_TIMEOUT=120
FREEZE_MODULES=true
FREEZE_MODE=auto
UNFREEZE_APPS=true
